<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neurova</title>
<link rel="icon" href="favicon-96x96.png" type="image/x-icon">
<script>
(function(){
  var SITE_VERSION = '20261004-15';
  try{
    var remembered = localStorage.getItem('neurovaSiteVersion');
    var target;
    if(remembered === 'desktop' || remembered === 'mobile'){
      target = remembered + '.html';
    } else {
      var looksMobile = window.matchMedia('(max-width: 860px)').matches
        || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      target = looksMobile ? 'mobile.html' : 'desktop.html';
    }
    // Bumping ?v= on a release changes the URL, which is the only thing that reliably
    // busts a cached HTML page -- the asset version inside it can only bust the CSS and
    // JS it links to, never the page holding those links.
    location.replace(target + '?v=' + SITE_VERSION);
  } catch(e){
    location.replace('desktop.html?v=' + SITE_VERSION);
  }
})();
</script>
</head>
<body>
  <!-- Fallback for browsers with JavaScript disabled -->
  <noscript>
    <p style="font-family:sans-serif; padding:24px;">
      Redirecting requires JavaScript. Choose a version manually:
      <a href="desktop.html">Desktop version</a> &middot; <a href="mobile.html">Mobile version</a>
    </p>
  </noscript>
</body>
</html>

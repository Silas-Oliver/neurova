<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neurova</title>
<link rel="icon" href="favicon-96x96.png" type="image/x-icon">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f4f6f4">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Dark-appearance home screen icon. Apple does not document media on
     apple-touch-icon, so Safari may ignore this entirely; the plain link above is
     declared first and stands as the fallback. Both variants are dark tiles, so
     whichever one iOS picks the icon still reads -- this only changes the backdrop
     from the site green-black to the near-black gradient Apple puts behind dark
     icons. Untested on a device. -->
<link rel="apple-touch-icon" href="apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Neurova">
<script>
  // Offline support only; the site works exactly the same without it, so a failure here
  // is swallowed rather than surfaced. Registered on load so it never competes with the
  // first paint.
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
<script>
(function(){
  var SITE_VERSION = '20261117-57';
  try{
    // An explicit ?view= in the address overrides, and replaces, whatever was stored.
    // Without this the stored preference is a one-way door: it is written only by the
    // two footer links, it is consulted before any device detection, so a stale 'mobile'
    // outranks a desktop monitor for ever -- and the link that would undo it lives in a
    // footer that the sign-in screen hides. Anyone who ended up on the wrong layout and
    // was not signed in had no way back at all. ?view=desktop is that way back.
    var forced = null;
    try{
      var m = /[?&]view=(desktop|mobile)\b/.exec(window.location.search);
      if(m) forced = m[1];
    }catch(e){}
    if(forced){
      try{ localStorage.setItem('neurovaSiteVersion', forced); }catch(e){}
    }

    var remembered = forced || localStorage.getItem('neurovaSiteVersion');
    var target;
    if(remembered === 'desktop' || remembered === 'mobile'){
      target = remembered + '.html';
    } else {
      // Tablets get the desktop layout. The old test matched iPad at any size, so an
      // iPad in landscape loaded the phone layout across 1024px: cards, metric tabs and
      // the chart strung edge to edge. Capping that column only traded stretched for
      // squished -- a phone layout is the wrong layout for a tablet either way, and the
      // desktop one has no horizontal overflow at 768 or 1024.
      //
      // iPad is gone from the list and the width test drops to 700px, which is below an
      // iPad in portrait (768) and above any phone. Android is gone too: Android phones
      // send "Mobi" and are still caught, while Android tablets do not and now get the
      // desktop layout like every other tablet. iPadOS 13+ reports itself as Macintosh
      // anyway, so for those the width test was always the one doing the work.
      var looksMobile = window.matchMedia('(max-width: 700px)').matches
        || /Mobi|iPhone|iPod/i.test(navigator.userAgent);
      target = looksMobile ? 'mobile.html' : 'desktop.html';
    }
    // Bumping ?v= on a release changes the URL, which is the only thing that reliably
    // busts a cached HTML page -- the asset version inside it can only bust the CSS and
    // JS it links to, never the page holding those links.
    //
    // The hash has to be carried across by hand. It is not part of what gets replaced
    // here, so without this line every deep link into the site -- neurovatech.me/#contact
    // in an email, #data in a message, the links out of privacy.html -- silently landed
    // on the home page, because the redirect dropped the one part of the URL saying
    // where to go.
    location.replace(target + '?v=' + SITE_VERSION + (window.location.hash || ''));
  } catch(e){
    location.replace('desktop.html?v=' + SITE_VERSION + (window.location.hash || ''));
  }
})();
</script>
</head>
<body>
  <!-- Fallback for browsers with JavaScript disabled -->
  <noscript>
    <p style="font-family:sans-serif; padding:24px;">
      Redirecting requires JavaScript. Choose a version manually:
      <a href="desktop.html">Desktop version</a> &middot; <a href="mobile.html">Mobile version</a>
    </p>
  </noscript>
</body>
</html>
